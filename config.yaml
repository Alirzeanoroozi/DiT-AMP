mode: "sample"  # "train" or "sample" or "eval"
N: 28 # amino acid alphabet size
n_T: 1000

# Data
data_path: "data/data.fasta"
batch_size: 128
max_length: 30

# Training
device: "cuda:0"
num_samples: 1000
num_train_epochs: 50
eval_every: 900
lr: 5e-4
weight_decay: 0.01
hybrid_loss_coeff: 0.001
# Model
dim: 512
n_layers: 4
n_heads: 8
